<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedbacKing - 마이페이지</title>
    <link rel="stylesheet" type="text/css" href="FK.css">
    <style>
        .mypage-layout { max-width: 700px; margin: 40px auto; padding: 0 20px; }
        .profile-card { background: white; padding: 25px; border-radius: 16px; border: 1px solid #e5e7eb; margin-bottom: 20px; }
        .ai-analysis-card { background: linear-gradient(135deg, #111827 0%, #047857 100%); color: white; padding: 30px; border-radius: 16px; margin-bottom: 25px; }
        .data-section { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e5e7eb; margin-bottom: 15px; }
        .data-list { list-style: none; padding: 0; margin: 0; }
        .data-list li { padding: 12px 0; border-bottom: 1px solid #f3f4f6; font-size:14px; color:#4b5563; display: flex; justify-content: space-between; align-items: center; }
        .data-list li:last-child { border: none; }
    </style>
</head>
<body>

    <h2 class="encounter" onclick="window.location.href='FK.html'" style="cursor:pointer;">FeedbacKing</h2>

    <div class="mypage-layout">
        <div class="profile-card">
            <h3>🔑 마이페이지 계정 정보</h3>
            <p style="margin:5px 0; font-size:14px; color:#4b5563;"><strong>로그인 계정 ID:</strong> <span id="userIdDisplay" style="color:#10b981; font-weight:bold;">-</span></p>
            <p style="margin:5px 0; font-size:14px; color:#4b5563;"><strong>비밀번호 보안인증:</strong> <span id="userPwDisplay">-</span></p>
        </div>

        <div class="ai-analysis-card">
            <span style="font-size:11px; text-transform:uppercase; letter-spacing:1px; background:rgba(16,185,129,0.2); padding:4px 8px; border-radius:4px; font-weight:bold;">Psychology Analysis</span>
            <h2 id="aiPersonaTitle" style="margin:10px 0 5px 0; color:#10b981;">분석 로딩 중...</h2>
            <p id="aiPersonaDesc" style="margin:0; font-size:14px; color:#cbd5e1; line-height:1.6;"></p>
        </div>

        <div class="data-section">
            <h4>🎤 내가 주최한 발표 리스트 (실시간 컨트롤 타워)</h4>
            <ul id="hostedList" class="data-list"></ul>
        </div>

        <div class="data-section">
            <h4>🎧 내가 청강하고 평가한 내역</h4>
            <ul id="listenedList" class="data-list"></ul>
        </div>

        <button onclick="window.location.href='FK.html'" style="width:100%; height:48px; background:#111827; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px;">발표 광장으로 가기</button>
    </div>

    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
        
        if(!currentUser) {
            alert('로그인 세션 정보가 없습니다. 광장 메인 화면으로 리다이렉트합니다.');
            window.location.href = 'FK.html';
        } else {
            document.getElementById('userIdDisplay').innerText = currentUser.id;
            document.getElementById('userPwDisplay').innerText = "•".repeat(currentUser.password.length) + " (암호화 보호됨)";
        }

        const speechList = JSON.parse(localStorage.getItem('speechList')) || [];
        const globalFeedbackList = JSON.parse(localStorage.getItem('globalFeedbackList')) || [];
        
        // [실시간 라이브 기능 추가] 현재 공유 중인 글로벌 라이브 스피치 식별 ID 대조
        const currentLiveId = localStorage.getItem('liveSpeechId');

        const myHostedSpeeches = speechList.filter(s => s.owner === currentUser.id);
        const myGivenFeedbacks = globalFeedbackList.filter(f => f.reviewer === currentUser.id);

        // 내가 주최한 리스트 바인딩 및 라이브 토글 버튼 조립
        const hostedUl = document.getElementById('hostedList');
        if(myHostedSpeeches.length === 0) {
            hostedUl.innerHTML = `<li>아직 개설하여 등록한 발표가 존재하지 않습니다.</li>`;
        } else {
            myHostedSpeeches.forEach(s => {
                // [실시간 라이브 기능 추가] 현재 해당 스피치가 LIVE 중인지 파악하여 버튼 분기
                const isLiveNow = (currentLiveId === String(s.id));
                const liveActionBtn = isLiveNow 
                    ? `<button onclick="stopLiveSpeech()" style="background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">⏹️ 라이브 종료</button>`
                    : `<button onclick="startLiveSpeech(${s.id})" style="background:#10b981; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:12px;">⚡ 라이브 시작</button>`;

                hostedUl.innerHTML += `
                    <li>
                        <span>📢 <strong>${s.title}</strong> <small style="color:#9ca3af; margin-left:5px;">(${s.location})</small></span>
                        ${liveActionBtn}
                    </li>`;
            });
        }

        // [실시간 라이브 기능 추가] 라이브 트리거 활성화 핸들러 함수
        function startLiveSpeech(id) {
            localStorage.setItem('liveSpeechId', id);
            alert('🔥 라이브 연동 성공!\n이제 광장 메인 페이지 최상단에 본 발표문이 라이브 피드백 배너로 고정 노출됩니다.');
            location.reload();
        }

        // [실시간 라이브 기능 추가] 라이브 셧다운 오프 핸들러 함수
        function stopLiveSpeech() {
            localStorage.removeItem('liveSpeechId');
            alert('⏹️ 라이브 무대가 성공적으로 종료되어 광장 배너가 해제되었습니다.');
            location.reload();
        }

        const listenedUl = document.getElementById('listenedList');
        if(myGivenFeedbacks.length === 0) {
            listenedUl.innerHTML = `<li>아직 광장에서 청강 후 남긴 피드백 리포트가 없습니다.</li>`;
        } else {
            myGivenFeedbacks.forEach(f => {
                const targetSpeech = speechList.find(s => s.id === f.speechId);
                const titleStr = targetSpeech ? targetSpeech.title : "종료된 세션 발표";
                listenedUl.innerHTML += `<li><span>✅ [${titleStr}]</span> <strong>${f.score}.0점</strong></li>`;
            });
        }

        const aiPersonaTitle = document.getElementById('aiPersonaTitle');
        const aiPersonaDesc = document.getElementById('aiPersonaDesc');

        if(myGivenFeedbacks.length === 0) {
            aiPersonaTitle.innerText = "🌱 가치관 탐색가";
            aiPersonaDesc.innerText = "아직 축적된 피드백 빅데이터가 모자라 분석을 보류 중입니다. 광장에 개방된 무대를 시청하고 첫 점수를 입력하시면 정교한 성향 도출이 시작됩니다.";
        } else {
            const sumScore = myGivenFeedbacks.reduce((acc, cur) => acc + cur.score, 0);
            const scoreAvg = sumScore / myGivenFeedbacks.length;
            const textLengthAvg = myGivenFeedbacks.reduce((acc, cur) => acc + cur.comment.length, 0) / myGivenFeedbacks.length;

            if(scoreAvg >= 4.2) {
                aiPersonaTitle.innerText = "👼 따뜻한 격려가 (천사표 청중)";
                aiPersonaDesc.innerText = "당신은 발표의 아쉬운 점보다 연설자의 잠재력과 장점을 캐치해 내는 능력이 탁월합니다. 전반적으로 높은 가중치의 별점 보상을 던져 무대 위의 화자에게 거대한 정서적 용기를 불어넣는 따스한 멘토링 스타일입니다.";
            } else if (scoreAvg <= 3.2 && textLengthAvg >= 35) {
                aiPersonaTitle.innerText = "🔥 날카로운 현장 비평가";
                aiPersonaDesc.innerText = "단순 비난이 아닙니다. 별점은 엄격하고 깐깐하게 다스리되, 텍스트 피드백의 길이가 장문형으로 매우 구체적입니다. 연설 구성의 인과 관계나 자료의 부족함을 논리적으로 조명하여 실제 스피커 실력을 고속 튜닝시키는 귀중한 평론가 성향입니다.";
            } else {
                aiPersonaTitle.innerText = "🧐 이성적인 데이터 분석가";
                aiPersonaDesc.innerText = "감정에 휘둘리지 않는 밸런스 균형 감각의 대명사입니다. 잘한 부분과 부족한 면의 저울질이 완벽히 일정하며, 표준 편차에 수렴하는 합리적이고 객관적인 스코어링 지표를 유지하는 이상적인 정보 중심 청중 유형입니다.";
            }
        }
    </script>
</body>
</html>
