<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedbacKing</title>
    <link rel="stylesheet" type="text/css" href="FK.css">
    <link rel="stylesheet" type="text/js" href="FK_js">
</head>
<body>

    <h2 class="encounter">FeedbacKing</h2>

    <div class="navigation">
        <button onclick="GoToPage('FK.html')">발표 광장</button>
        <button class="Spech_Register" onclick="Register_Spech()" >발표 등록하기</button>

        <button  onclick="GoToPage('FK_GiveFeedback.html')">피드백 참여</button>
        <button  onclick="GoToPage('FK_introduce.html')">Introduction</button>
        <button id="hover">마이페이지</button>
    </div>
    <hr>
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h3>새 발표 등록하기</h3>
            <input type="text" id="regTitle" placeholder="발표 제목">
            <input type="text" id="regSpeaker" placeholder="발표자 이름">
            <input type="text" id="regLocation" placeholder="발표 장소">
            <input type="datetime-local" id="regDateTime" placeholder="발표 일시">
            <textarea id="regContent" rows="4" placeholder="발표 내용을 입력하세요"></textarea>
            
            <div class="modal-buttons">
                <button class="btn-submit" onclick="submitSpeech()">게시하기</button>
                <button class="btn-close" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

<script src="FK.js"></script>
</body>
</html>
