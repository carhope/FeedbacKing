<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedbacKing - 실시간 라이브 플랫폼</title>
    <link rel="stylesheet" type="text/css" href="FK.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        @keyframes liveBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .btn-delete { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 4px; transition: 0.2s; }
        .btn-delete:hover { transform: scale(1.15); }
        .presenter-note-box { background: #f0fdf4; border-left: 4px solid #10b981; padding: 10px 12px; margin: 10px 0; border-radius: 0 8px 8px 0; font-size: 13px; color: #047857; }
    </style>
</head>
<body>

    <h2 class="encounter" onclick="window.location.reload();" style="cursor:pointer;">FeedbacKing</h2>

    <div class="navigation" style="display: flex; align-items: center; gap: 10px;">
        <button class="active Spech_Main_Home" onclick="GoToPage('FK.html')">발표 광장</button>
        <button class="Spech_Register" onclick="checkLoginAndRegister()">발표 등록하기</button>
        <button onclick="GoToPage('FK_introduce.html')">Introduction</button>
        <button onclick="GoToPage('FK_MyPage.html')">마이페이지</button>
        
        <div id="authMenu" style="margin-left: auto; display: flex; align-items: center; gap: 10px;">
            <span id="welcomeMsg" style="font-size: 14px; font-weight: bold; color: #10b981;"></span>
            <button id="btnLogin" onclick="promptLogin()" style="background: #111827; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">로그인</button>
            <button id="btnLogout" onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; display: none;">로그아웃</button>
        </div>
    </div>

    <div id="liveBanner" style="display: none; background: linear-gradient(90deg, #0f172a 0%, #047857 100%); border: 2px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); padding: 15px 25px; border-radius: 12px; margin: 20px 0; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 15px;">
            <span style="background: #ef4444; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; animation: liveBlink 1s infinite; letter-spacing: 1px;">🔥 LIVE</span>
            <div style="color: white;">
                <span style="font-size: 12px; color: #a7f3d0; font-weight: bold; display: block; margin-bottom: 2px;">현재 무대에서 실시간 라이브 피드백 진행 중!</span>
                <strong id="liveTitle" style="font-size: 18px; color: #ffffff;">발표 제목</strong>
            </div>
        </div>
        <button id="liveBtn" style="color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;"></button>
    </div>

    <div id="searchBar">
        <input type="text" id="searchTitle" placeholder="제목 검색">
        <input type="text" id="searchSpeaker" placeholder="발표자 검색">
        <input type="text" id="searchLocation" placeholder="장소 검색">
        <input type="text" id="searchDate" placeholder="날짜 검색 (예: 2026-06)">
        
        <div class="search-buttons">
            <button class="btn-search" onclick="searchSpeeches()">검색</button>
            <button class="btn-reset" onclick="resetSearch()">초기화</button>
        </div>
    </div>

    <div id="spechesContainer"></div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <h3>새 발표 등록하기</h3>
            <input type="text" id="regTitle" placeholder="발표 제목">
            <input type="text" id="regSpeaker" placeholder="발표자 이름">
            <input type="text" id="regLocation" placeholder="발표 장소">
            <input type="datetime-local" id="regDateTime">
            
            <label style="font-size: 13px; font-weight: bold; color: #4b5563; margin-top: 5px;">피드백 인증 방식</label>
            <select id="regAuthType" onchange="toggleAuthFields()" style="width: 100%; height: 44px; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; background-color: #f9fafb; font-weight: 600;">
                <option value="none">🔓 인증 없음 (자유롭게 참여)</option>
                <option value="quiz">📺 영상 퀴즈 인증 (온라인 청중용)</option>
                <option value="password">🔒 입장 암호 인증 (오프라인 현장용)</option>
            </select>

            <div id="authQuizFields" style="display: none; flex-direction: column; gap: 12px; margin-top: 10px;">
                <input type="text" id="regYoutube" placeholder="유튜브 영상 링크 (예: https://youtu.be/...)">
                <input type="text" id="regQuizQuestion" placeholder="청중이 맞출 퀴즈 질문 (예: 마지막 단어는?)">
                <input type="text" id="regQuizAnswer" placeholder="퀴즈 정답">
            </div>

            <div id="authPasswordFields" style="display: none; flex-direction: column; gap: 12px; margin-top: 10px;">
                <input type="password" id="regPassword" placeholder="피드백 입장 암호 (숫자 4자리)" maxlength="4">
            </div>

            <textarea id="regPresenterNote" rows="2" placeholder="💡 청중에게 집중 피드백을 받고 싶은 부분을 적어주세요! (예: 발표 속도나 슬라이드 가시성을 중점적으로 봐주세요!)" style="margin-top: 10px; border: 1px solid #10b981; background: #f0fdf4;"></textarea>
            
            <textarea id="regContent" rows="4" placeholder="발표 내용을 입력하세요" style="margin-top: 10px;"></textarea>
            
            <div class="modal-buttons">
                <button class="btn-submit" onclick="submitSpeech()">게시하기</button>
                <button class="btn-close" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <script src="FK.js"></script>
</body>
</html>
