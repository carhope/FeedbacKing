<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedbacKing - 연설자 대시보드</title>
    <link rel="stylesheet" type="text/css" href="FK.css">
    <style>
        .dashboard-layout { max-width: 750px; margin: 40px auto; padding: 0 20px; }
        .summary-grid { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-card { flex: 1; background: #111827; color: white; padding: 25px; border-radius: 16px; text-align: center; }
        .stat-card.light { background: white; color: #111827; border: 1px solid #e5e7eb; }
        .card-list { background: white; padding: 25px; border-radius: 16px; border: 1px solid #e5e7eb; margin-bottom: 20px; }
        .comment-item { padding: 15px; border-bottom: 1px dashed #e5e7eb; }
        .comment-item:last-child { border:none; }
    </style>
</head>
<body>

    <h2 class="encounter" onclick="window.location.href='FK.html'" style="cursor:pointer;">FeedbacKing</h2>

    <div class="dashboard-layout">
        <h2 id="dashTitle" style="color:#111827; margin-bottom: 5px;">발표 통계 대시보드</h2>
        <p id="dashMeta" style="color:#6b7280; font-size:14px; margin-bottom:25px;"></p>

        <div class="summary-grid">
            <div class="stat-card">
                <span style="font-size:12px; color:#10b981; font-weight:bold;">종합 청중 만족도</span>
                <h1 id="avgScoreDisplay" style="margin: 10px 0; font-size:42px;">0.0</h1>
                <div id="starDisplay" style="color:#f59e0b; font-size:20px;"></div>
            </div>
            <div class="stat-card light">
                <span style="font-size:12px; color:#4b5563; font-weight:bold;">청중 피드백 키워드</span>
                <h2 id="keywordDisplay" style="margin: 15px 0; color:#10b981; font-size:22px;">데이터 수집 중</h2>
                <p id="totalReviewers" style="margin:0; font-size:12px; color:#6b7280;"></p>
            </div>
        </div>

        <div class="card-list">
            <h3 style="margin-top:0; color:#111827; border-bottom:2px solid #111827; padding-bottom:10px;">💬 청중 한줄평 원문 목록</h3>
            <div id="commentContainer"></div>
        </div>
        
        <button onclick="window.location.href='FK.html'" style="width:100%; height:48px; background:#111827; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">발표 광장으로 복귀</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const currentId = Number(params.get('id'));
        
        const speechList = JSON.parse(localStorage.getItem('speechList')) || [];
        const globalFeedbackList = JSON.parse(localStorage.getItem('globalFeedbackList')) || [];

        const speech = speechList.find(s => s.id === currentId);
        const myFeedbacks = globalFeedbackList.filter(f => f.speechId === currentId);

        if(speech) {
            document.getElementById('dashTitle').innerText = `📊 [${speech.title}] 피드백 분석`;
            document.getElementById('dashMeta').innerText = `발표자: ${speech.speaker} | 장소: ${speech.location}`;
        }

        if(myFeedbacks.length === 0) {
            document.getElementById('commentContainer').innerHTML = `<p style="text-align:center; color:#9ca3af; padding:20px 0;">아직 청중들이 남긴 피드백 데이터가 존재하지 않습니다.</p>`;
            document.getElementById('totalReviewers').innerText = "참여 인원 0명";
        } else {
            // 별점 가중치 연산
            const totalScore = myFeedbacks.reduce((acc, cur) => acc + cur.score, 0);
            const avg = (totalScore / myFeedbacks.length).toFixed(1);
            document.getElementById('avgScoreDisplay').innerText = `${avg} / 5.0`;
            document.getElementById('starDisplay').innerText = "★".repeat(Math.round(avg));
            document.getElementById('totalReviewers').innerText = `총 ${myFeedbacks.length}명의 청중 참여 완료`;

            // 가상 다이나믹 키워드 추출기
            let keyword = "전달력 최고 👍";
            if(avg < 3.5) keyword = "개선 필요 🛠️";
            else if(avg >= 3.5 && avg < 4.3) keyword = "깔끔한 구성 📋";
            document.getElementById('keywordDisplay').innerText = keyword;

            // 한줄평 리스트 바인딩
            const container = document.getElementById('commentContainer');
            myFeedbacks.reverse().forEach(f => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                        <span style="font-size:12px; font-weight:bold; color:#4b5563;">익명의 청중 (${f.reviewer})</span>
                        <span style="color:#f59e0b; font-size:13px;">${"★".repeat(f.score)}</span>
                    </div>
                    <p style="margin:0; color:#111827; font-size:14px; line-height:1.5;">"${f.comment}"</p>
                `;
                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
