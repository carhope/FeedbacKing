<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeedbacKing - 연설자 대시보드</title>
    <link rel="stylesheet" type="text/css" href="FK.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        .dashboard-layout { max-width: 750px; margin: 40px auto; padding: 0 20px; }
        .summary-grid { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-card { flex: 1; background: #111827; color: white; padding: 25px; border-radius: 16px; text-align: center; }
        .stat-card.light { background: white; color: #111827; border: 1px solid #e5e7eb; }
        .card-list { background: white; padding: 25px; border-radius: 16px; border: 1px solid #e5e7eb; margin-bottom: 20px; }
        .comment-item { padding: 15px; border-bottom: 1px dashed #e5e7eb; }
        .comment-item:last-child { border:none; }
    </style>
</head>
<body>

    <h2 class="encounter" id="logoHome" style="cursor:pointer;">FeedbacKing</h2>

    <div class="dashboard-layout">
        <h2 id="dashTitle" style="color:#111827; margin-bottom: 5px;">발표 통계 대시보드</h2>
        <p id="dashMeta" style="color:#6b7280; font-size:14px; margin-bottom:25px;">데이터 분석 인프라 연결 중...</p>

        <div class="summary-grid">
            <div class="stat-card">
                <span style="font-size:12px; color:#10b981; font-weight:bold;">종합 청중 만족도</span>
                <h1 id="avgScoreDisplay" style="margin: 10px 0; font-size:42px;">0.0</h1>
                <div id="starDisplay" style="color:#f59e0b; font-size:20px;"></div>
            </div>
            <div class="stat-card light">
                <span style="font-size:12px; color:#4b5563; font-weight:bold;">청중 피드백 키워드</span>
                <h2 id="keywordDisplay" style="margin: 15px 0; color:#10b981; font-size:22px;">데이터 수집 중</h2>
                <p id="totalReviewers" style="margin:0; font-size:12px; color:#6b7280;"></p>
            </div>
        </div>

        <div class="card-list">
            <h3 style="margin-top:0; color:#111827; border-bottom:2px solid #111827; padding-bottom:10px;">💬 청중 한줄평 원문 목록</h3>
            <div id="commentContainer"></div>
        </div>
        
        <button id="btnBackToSquare" style="width:100%; height:48px; background:#111827; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">발표 광장으로 복귀</button>
    </div>

    <script type="module">
        import { firebaseConfig } from './config.js';
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        // 파이어베이스 DB 선언 바로 아래에 추가

        // 🔥 발표장 방화벽 프리패스를 위한 절대 방패 코드!
        db.settings({ experimentalForceLongPolling: true });
        const params = new URLSearchParams(window.location.search);
        const currentId = Number(params.get('id'));

        window.addEventListener('DOMContentLoaded', async () => {
            // 상단 홈 이동 및 광장 복귀 버튼 이벤트
            document.getElementById('logoHome')?.addEventListener('click', () => window.location.href = 'FK.html');
            document.getElementById('btnBackToSquare')?.addEventListener('click', () => window.location.href = 'FK.html');

            if (!currentId) {
                alert('올바르지 않은 접근입니다.');
                window.location.href = 'FK.html';
                return;
            }

            // 1. 파이어베이스로부터 해당 발표 세션 기본 정보 가져오기
            try {
                const speechSnapshot = await db.collection('speeches').where('id', '==', currentId).get();
                if (!speechSnapshot.empty) {
                    const speech = speechSnapshot.docs[0].data();
                    document.getElementById('dashTitle').innerText = `📊 [${speech.title}] 피드백 분석`;
                    document.getElementById('dashMeta').innerText = `발표자: ${speech.speaker} | 장소: ${speech.location}`;
                } else {
                    document.getElementById('dashMeta').innerText = "존재하지 않거나 삭제된 발표 세션입니다.";
                    return;
                }

                // 2. 파이어베이스 실시간 스트리밍 리스너 연결 (청중이 제출하는 즉시 대시보드 실시간 업데이트)
                db.collection('feedbacks').where('speechId', '==', currentId).onSnapshot(snapshot => {
                    const myFeedbacks = [];
                    snapshot.forEach(doc => myFeedbacks.push(doc.data()));

                    const container = document.getElementById('commentContainer');
                    container.innerHTML = '';

                    if (myFeedbacks.length === 0) {
                        container.innerHTML = `<p style="text-align:center; color:#9ca3af; padding:20px 0;">아직 청중들이 남긴 피드백 데이터가 존재하지 않습니다.</p>`;
                        document.getElementById('totalReviewers').innerText = "참여 인원 0명";
                        document.getElementById('avgScoreDisplay').innerText = "0.0";
                        document.getElementById('starDisplay').innerText = "";
                        document.getElementById('keywordDisplay').innerText = "데이터 수집 중";
                        return;
                    }

                    // 연산 핸들러 가동
                    const totalScore = myFeedbacks.reduce((acc, cur) => acc + Number(cur.score), 0);
                    const avg = (totalScore / myFeedbacks.length).toFixed(1);
                    document.getElementById('avgScoreDisplay').innerText = `${avg} / 5.0`;
                    document.getElementById('starDisplay').innerText = "★".repeat(Math.round(avg));
                    document.getElementById('totalReviewers').innerText = `총 ${myFeedbacks.length}명의 청중 참여 완료`;

                    // 실시간 만족도 기반 가상 지능형 키워드 밸런싱
                    let keyword = "전달력 최고 👍";
                    if (avg < 3.5) keyword = "개선 필요 🛠️";
                    else if (avg >= 3.5 && avg < 4.3) keyword = "깔끔한 구성 📋";
                    document.getElementById('keywordDisplay').innerText = keyword;

                    // 최신 피드백이 위로 올라오도록 시간순 정렬
                    myFeedbacks.sort((a, b) => b.id - a.id);

                    // 화면 엘리먼트 동적 드로잉
                    myFeedbacks.forEach(f => {
                        const item = document.createElement('div');
                        item.className = 'comment-item';
                        item.innerHTML = `
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                                <span style="font-size:12px; font-weight:bold; color:#4b5563;">익명의 청중 (${f.reviewer})</span>
                                <span style="color:#f59e0b; font-size:13px;">${"★".repeat(f.score)}</span>
                            </div>
                            <p style="margin:0; color:#111827; font-size:14px; line-height:1.5;">"${f.comment}"</p>
                        `;
                        container.appendChild(item);
                    });
                });

            } catch (error) {
                console.error("클라우드 통계 덤프 에러:", error);
            }
        });
    </script>
</body>
</html>
